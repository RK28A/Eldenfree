name: build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "dist/**"
      - "cmake/**"
      - "launcher/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  dll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw.cmake -DCMAKE_BUILD_TYPE=Release -DEF_VERSION=v1.0.${{ github.run_number }}
          cmake --build build
      - name: Package
        run: |
          mkdir -p pkg
          cp build/launcher/EldenFree.exe dist/LISEZMOI.txt pkg/
          cd pkg && zip -q -r ../EldenFree.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: EldenFree
          path: pkg/
          retention-days: 30
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EldenFree v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: EldenFree.zip
          body: |
            Télécharger EldenFree.zip, lancer EldenFree.exe (Steam ouvert) : le jeu démarre hors ligne avec le mod. F10 en jeu.
