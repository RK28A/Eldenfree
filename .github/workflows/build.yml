name: build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "dist/**"
      - "cmake/**"
      - ".github/workflows/build.yml"

jobs:
  dll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Package
        run: |
          mkdir pkg
          cp build/EldenFree.dll dist/LISEZMOI.txt dist/config_eldenring.example.toml pkg/
          cd pkg && zip -q ../EldenFree.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: EldenFree
          path: pkg/*
          retention-days: 30
