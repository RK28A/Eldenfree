name: build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "dist/**"
      - "cmake/**"
      - "launcher/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  dll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: ModEngine2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p me2dl pkg/ModEngine2 pkg/mods
          if gh release download --repo soulsmods/ModEngine2 --pattern "*.zip" --dir me2dl; then
            for z in me2dl/*.zip; do unzip -q -o "$z" -d me2x; done
            exe=$(find me2x -name modengine2_launcher.exe | head -1)
            if [ -n "$exe" ]; then cp -r "$(dirname "$exe")"/. pkg/ModEngine2/; fi
          else
            echo "ModEngine2 indisponible"
          fi
          cp dist/mods_LISEZMOI.txt pkg/mods/LISEZMOI.txt
      - name: Package
        run: |
          cp build/launcher/EldenFree.exe build/EldenFree.dll dist/LISEZMOI.txt dist/config_eldenring.example.toml pkg/
          cd pkg && zip -q -r ../EldenFree.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: EldenFree
          path: pkg/
          retention-days: 30
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EldenFree v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: EldenFree.zip
          body: |
            Télécharger EldenFree.zip, lancer EldenFree.exe (Steam ouvert) : le jeu démarre hors ligne avec le mod. F10 en jeu.
